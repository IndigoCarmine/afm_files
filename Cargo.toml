[package]
name = "afm_files"
version = "0.3.0"
edition = "2021"

[package.metadata.bundle]
name = "Kintuba AFM Viewer"
identifier = "io.github.indigocarmine.kintuba"
version = "0.3.0"
icon = ["assets/AppIcon.icns"]

copyright = "Copyright (c) Yuhei Yamada 2026. All rights reserved."

category = "Utilities"

short_description = "AFM viewer"

long_description = """
AFM Viewer is a desktop application for viewing and analyzing
Bruker Nanoscope SPM files (.spm).

Features include height map display with colormaps (AFM Hot, Gray, Viridis),
polynomial line flattening, pan/zoom, and line profile analysis with
marker-based distance and height difference measurements.
"""

[[bin]]
name = "afm_viewer"
path = "src/main.rs"

[dependencies]
# Use the glow (OpenGL) backend for eframe: the 3D surface view renders via
# egui_glow, and glow is lighter than the default wgpu backend.
eframe    = { version = "0.34.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui      = "0.34.3"
egui_glow = "0.34.3"
egui_plot = "0.35.0"
glow      = "0.17"
glam      = "0.29"
bytemuck  = { version = "1", features = ["derive"] }
ab_glyph  = "0.2"
rfd       = "0.17.2"
image     = "0.25"
arboard   = "3"

[target.'cfg(target_os = "macos")'.dependencies]
block2            = "0.6"
objc2             = "0.6"
objc2-foundation  = { version = "0.3", features = [
    "block2",
    "NSError",
    "NSFileCoordinator",
    "NSFileManager",
    "NSString",
    "NSURL",
] }

[build-dependencies]
winresource = "0.1"